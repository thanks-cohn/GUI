name: Validate GUI launcher

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile launcher
        run: python -m py_compile pairing_gui.py
      - name: Dump standalone source
        run: python pairing_gui.py --dump-source /tmp/pairing_gui_v34_source.py
      - name: Compile standalone source
        run: python -m py_compile /tmp/pairing_gui_v34_source.py
      - name: Verify version and resumable BulkOCR studio
        run: |
          grep -q 'APP_VERSION = "34.0"' /tmp/pairing_gui_v34_source.py
          grep -q '^import tkinter as tk$' /tmp/pairing_gui_v34_source.py
          grep -q '^from tkinter import messagebox, ttk$' /tmp/pairing_gui_v34_source.py
          grep -q 'run_table3_bulkocr_export_studio' /tmp/pairing_gui_v34_source.py
          grep -q 'ingest_ocr_records' /tmp/pairing_gui_v34_source.py
          grep -q '_v34_append_jsonl' /tmp/pairing_gui_v34_source.py
          grep -q '01-bulkocr-progress.jsonl' /tmp/pairing_gui_v34_source.py
          grep -q 'ttk.Progressbar' /tmp/pairing_gui_v34_source.py
          grep -q 'Run / Resume BulkOCR' /tmp/pairing_gui_v34_source.py
          grep -q "lf=tk.Frame(card,bg='#172124',padx=20,pady=0)" /tmp/pairing_gui_v34_source.py
          ! grep -q "lf=tk.Frame(card,bg='#172124',padx=20,pady=(0,16))" /tmp/pairing_gui_v34_source.py