name: Validate GUI launcher

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile launcher
        run: python -m py_compile pairing_gui.py
      - name: Dump and precompile standalone source
        run: python pairing_gui.py --dump-source /tmp/pairing_gui_v34_2_source.py
      - name: Compile standalone source independently
        run: python -m py_compile /tmp/pairing_gui_v34_2_source.py
      - name: Verify version, wheel guard, and resumable BulkOCR studio
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('/tmp/pairing_gui_v34_2_source.py')
          source = path.read_text(encoding='utf-8')
          assert 'APP_VERSION = "34.2"' in source
          assert re.search(
              r'(?m)^(?P<i>[ \t]*)try:\n'
              r'(?P=i)    target = root\.winfo_containing\(event\.x_root, event\.y_root\)\n'
              r'(?P=i)except \(KeyError, tk\.TclError\):\n'
              r'(?P=i)    return$',
              source,
          ), 'wheel guard indentation is invalid'
          for token in (
              'import tkinter as tk',
              'from tkinter import messagebox, ttk',
              'run_table3_bulkocr_export_studio',
              'ingest_ocr_records',
              '_v34_append_jsonl',
              '01-bulkocr-progress.jsonl',
              'ttk.Progressbar',
              'Run / Resume BulkOCR',
              "lf=tk.Frame(card,bg='#172124',padx=20,pady=0)",
          ):
              assert token in source, token
          assert "lf=tk.Frame(card,bg='#172124',padx=20,pady=(0,16))" not in source
          PY