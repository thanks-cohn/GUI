name: Validate GUI launcher

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile launcher and gallery patches
        run: |
          python -m py_compile \
            pairing_gui.py \
            gallery_pagination_v35.py \
            gallery_virtual_v36.py

      - name: Dump and precompile standalone source
        run: python pairing_gui.py --dump-source /tmp/pairing_gui_v36_source.py

      - name: Compile standalone source independently
        run: python -m py_compile /tmp/pairing_gui_v36_source.py

      - name: Verify bounded expandable galleries and resumable BulkOCR studio
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('/tmp/pairing_gui_v36_source.py')
          source = path.read_text(encoding='utf-8')

          assert 'APP_VERSION = "36.0"' in source
          assert re.search(
              r'(?m)^(?P<i>[ \t]*)try:\n'
              r'(?P=i)    target = root\.winfo_containing\(event\.x_root, event\.y_root\)\n'
              r'(?P=i)except \(KeyError, tk\.TclError\):\n'
              r'(?P=i)    return$',
              source,
          ), 'wheel guard indentation is invalid'

          required = (
              'import tkinter as tk',
              'from tkinter import messagebox, ttk',
              'PAIRING_PAGE_SIZE = 20',
              'PAIRING_LIVE_WINDOW_LIMIT = 60',
              'candidate_window_start = 0',
              'candidate_visible_count = PAIRING_PAGE_SIZE',
              'candidate_selected_jsons',
              'def sync_visible_candidate_selections()',
              'def shift_candidate_window(',
              'def shift_exact_window(',
              'SHOW 20 MORE ▼',
              '◀ SHOW 20 ABOVE',
              'window_shift_pending',
              'during_drag=True',
              'append_pairing_journal(',
              'replay_pairing_journal()',
              '-pairing-session.jsonl',
              'widgets capped at',
              'run_table3_bulkocr_export_studio',
              'ingest_ocr_records',
              '_v34_append_jsonl',
              '01-bulkocr-progress.jsonl',
              'ttk.Progressbar',
              'Run / Resume BulkOCR',
              "lf=tk.Frame(card,bg='#172124',padx=20,pady=0)",
          )
          for token in required:
              assert token in source, token

          forbidden = (
              '◀ PREVIOUS 20',
              'NEXT 20 ▶',
              "lf=tk.Frame(card,bg='#172124',padx=20,pady=(0,16))",
          )
          for token in forbidden:
              assert token not in source, token
          PY

      - name: Check bounded-window transition model
        run: |
          python - <<'PY'
          batch = 20
          limit = 60
          total = 273
          start = 0
          visible = 20
          observed = [(start, start + visible)]

          for _ in range(5):
              end = start + visible
              if visible < limit:
                  visible = min(limit, visible + batch, total - start)
              elif end < total:
                  start = min(total - visible, start + batch)
              observed.append((start, min(total, start + visible)))

          assert observed == [
              (0, 20),
              (0, 40),
              (0, 60),
              (20, 80),
              (40, 100),
              (60, 120),
          ]
          assert all(end - start <= limit for start, end in observed)
          PY